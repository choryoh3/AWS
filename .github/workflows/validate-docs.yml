name: Validate docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".claude/**"
      - ".github/workflows/validate-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".claude/**"
      - ".github/workflows/validate-docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test hook / validation scripts
        run: python3 -m unittest discover -s tests -v
      - name: Validate project / spec / sprint contracts
        run: python3 scripts/validate_docs.py
